name: AI branch checks

on:
  push:
    branches: [feat/ai-paper-assistant]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: ilimchi-single-html
          path: dist/index.html
          if-no-files-found: error
          retention-days: 7
