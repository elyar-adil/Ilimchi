<body>
<div class="app" id="app">
 <aside class="sidebar" id="sidebar">
  <div class="brand"><img id="brand-icon" alt="Mori icon"><span>Mori</span><small>NOTES</small></div>

   <button class="nav-item" id="manage-tags"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>管理标签</button>
  </div>
  <div class="sidebar-bottom"><button class="bottom-btn" id="appearance-btn"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v3m0 14v3M4.93 4.93l2.12 2.12m9.9 9.9 2.12 2.12M2 12h3m14 0h3M4.93 19.07l2.12-2.12m9.9-9.9 2.12-2.12"/></svg>外观</button><button class="bottom-btn" id="settings-btn"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1a1.8 1.8 0 0 1-2.5 2.5l-.1-.1a1.8 1.8 0 0 0-3 .9v.2a1.8 1.8 0 0 1-3.6 0v-.2a1.8 1.8 0 0 0-3-.9l-.1.1a1.8 1.8 0 0 1-2.5-2.5l.1-.1a1.8 1.8 0 0 0-.9-3h-.2a1.8 1.8 0 0 1 0-3.6h.2a1.8 1.8 0 0 0 .9-3l-.1-.1a1.8 1.8 0 0 1 2.5-2.5l.1.1a1.8 1.8 0 0 0 3-.9v-.2a1.8 1.8 0 0 1 3.6 0v.2a1.8 1.8 0 0 0 3 .9l.1-.1a1.8 1.8 0 0 1 2.5 2.5l-.1.1a1.8 1.8 0 0 0 .9 3h.2a1.8 1.8 0 0 1 0 3.6h-.2a1.8 1.8 0 0 0-.9 3Z" transform="translate(2 2) scale(.83)"/></svg>设置</button></div>
 </aside>

const fmtDate=t=>{if(!t)return '刚刚';const d=new Date(t),now=new Date();if(d.toDateString()===now.toDateString())return '今天 '+d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false});if(now-d<86400000*7)return d.toLocaleDateString('zh-CN',{weekday:'short'});return d.toLocaleDateString('zh-CN',{month:'short',day:'numeric'});};

function defaultNotes(){let n=Date.now();return [{id:'welcome-note',title:'欢迎来到 Mori',body:'这里是你的新笔记本。\n\nMori 为想法留出了一张安静的纸。它足够轻，可以随手记下一句话；也足够完整，可以慢慢写成一篇文章。\n\n## 从这里开始\n\n- 用左侧的 **新建笔记** 随手记录\n- 用 `#标签` 整理主题，或在标签栏中筛选\n- 用 Markdown 写标题、列表、引用和待办事项\n- 在设置里连接自己的 **GitHub 私有仓库**，即可跨设备同步\n\n> 笔记默认只保存在当前浏览器里。连接 GitHub 之前，不会上传任何内容。\n\n试着把这篇欢迎笔记改成你自己的。',tags:['开始使用'],createdAt:n-60000,updatedAt:n-60000,favorite:true,pinned:true,deletedAt:null},{id:'idea-note',title:'灵感收集',body:'还没成形的想法，也值得留下来。\n\n- [ ] 记录下一个有趣的观察\n- [ ] 给值得深入的问题加上标签\n- [ ] 每周回看一次收藏\n\n---\n\n*不需要一开始就整理好。先写下来。*',tags:['想法'],createdAt:n-3600000,updatedAt:n-3600000,favorite:false,pinned:false,deletedAt:null},{id:'reading-note',title:'阅读笔记',body:'## 一句话总结\n\n在这里记下最重要的观点，而不是整段复制。\n\n## 值得记住\n\n> 哪一句话改变了你理解问题的方式？\n\n## 后续问题\n\n1. 这个观点依赖哪些假设？\n2. 有什么反例？\n3. 它能应用到哪里？',tags:['阅读','模板'],createdAt:n-86400000,updatedAt:n-86400000,favorite:false,pinned:false,deletedAt:null}];}
function loadLocal(){try{const a=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');state.notes=Array.isArray(a)?a:defaultNotes();const p=JSON.parse(localStorage.getItem(PREF_KEY)||'{}');Object.assign(state,{animal:p.animal||'owl',dark:!!p.dark,repo:p.repo||'elyar-adil/paper-notes-data',dir:p.dir||'mori-notes',sort:p.sort||'updated'});if(state.dark)document.body.classList.add('dark');}catch(e){state.notes=defaultNotes();}}
function saveLocal(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state.notes));localStorage.setItem(PREF_KEY,JSON.stringify({animal:state.animal,dark:state.dark,repo:state.repo,dir:state.dir,sort:state.sort}));$('local-status').textContent='已保存在本机';}catch(e){$('local-status').textContent='本机存储空间不足';}}
function currentNote(){return state.notes.find(n=>n.id===state.currentId)||null;}
function activeNotes(){return state.notes.filter(n=>!n.deletedAt);}
function noteWords(n){const body=(n?.body||'').trim();return body?body.split(/\s+/).length:0;}
function noteExcerpt(n){const s=(n.body||'').replace(/```[\s\S]*?```/g,'代码块').replace(/[#>*_`~\-\[\]()]/g,' ').replace(/\s+/g,' ').trim();return s.slice(0,145)||'空白笔记';}
function tagsList(){return [...new Set(activeNotes().flatMap(n=>n.tags||[]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh-CN'));}
function noteMatch(n){if(state.view==='trash')return !!n.deletedAt;if(n.deletedAt)return false;if(state.view==='favorites'&&!n.favorite)return false;if(state.view==='today'){const d=new Date(n.updatedAt||0);if(d.toDateString()!==new Date().toDateString())return false;}if(state.view==='tag'&&!((n.tags||[]).includes(state.tagFilter)))return false;const q=state.search.trim().toLowerCase();if(q&&!`${n.title||''}\n${n.body||''}\n${(n.tags||[]).join(' ')}`.toLowerCase().includes(q))return false;return true;}
function filteredNotes(){let a=state.notes.filter(noteMatch);a.sort((x,y)=>{if(state.view!=='trash'&&!!x.pinned!==!!y.pinned)return x.pinned?-1:1;return state.sort==='title'?(x.title||'').localeCompare(y.title||'','zh-CN'):(state.sort==='created'?(y.createdAt||0)-(x.createdAt||0):(y.updatedAt||0)-(x.updatedAt||0));});return a;}
function applyAnimal(){const a=ANIMALS.find(x=>x[0]===state.animal)||ANIMALS[2];document.documentElement.style.setProperty('--accent',a[2]);$('brand-icon').src=ICONS[state.animal]||ICONS.owl;$('empty-icon').src=ICONS[state.animal]||ICONS.owl;const fav=document.querySelector('link[rel=icon]');if(fav)fav.href=ICONS[state.animal]||ICONS.owl;renderSide();}
function renderSide(){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view&&state.view!=='tag'));$('count-all').textContent=activeNotes().length||'';$('count-today').textContent=activeNotes().filter(n=>new Date(n.updatedAt||0).toDateString()===new Date().toDateString()).length||'';$('count-trash').textContent=state.notes.filter(n=>n.deletedAt).length||'';const tags=tagsList();$('tag-nav').innerHTML=tags.length?tags.map((tag,i)=>`<button class="nav-item ${state.view==='tag'&&state.tagFilter===tag?'active':''}" data-tag="${escapeHtml(tag)}"><span class="tag-dot" style="--tag-color:${['#7a8fa8','#c18b5b','#81a17a','#a184b7','#d17d78'][i%5]}"></span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(tag)}</span><span class="nav-count">${activeNotes().filter(n=>(n.tags||[]).includes(tag)).length}</span></button>`).join(''):'<div style="padding:2px 11px 8px;font-size:10px;color:#aaa69e">还没有标签</div>';document.querySelectorAll('[data-tag]').forEach(b=>b.addEventListener('click',()=>{state.view='tag';state.tagFilter=b.dataset.tag;renderAll();closeMobileSidebar();}));}

function inlineMarkdown(s){let out=s;out=out.replace(/`([^`]+)`/g,'<code>$1</code>');out=out.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/__([^_]+)__/g,'<strong>$1</strong>');out=out.replace(/\*([^*\n]+)\*/g,'<em>$1</em>').replace(/_([^_\n]+)_/g,'<em>$1</em>');out=out.replace(/~~([^~]+)~~/g,'<del>$1</del>');out=out.replace(/!\[([^\]]*)\]\((https?:\/\/[^\s)]+)\)/g,'<span class="image-alt">[图片：$1]</span>');out=out.replace(/\[([^\]]+)\]\(((?:https?:\/\/|mailto:)[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');return out;}
function renderMarkdown(md){let text=escapeHtml(md||'').replace(/\r\n?/g,'\n'),codes=[];text=text.replace(/```([^\n]*)\n([\s\S]*?)```/g,(_,lang,code)=>{const i=codes.push(`<pre><code>${code.replace(/\n$/,'')}</code></pre>`)-1;return `\u0000CODE${i}\u0000`;});const lines=text.split('\n'),out=[];let para=[],ul=false,ol=false,quote=[];const flushP=()=>{if(para.length){out.push('<p>'+inlineMarkdown(para.join('<br>'))+'</p>');para=[];}};const flushList=()=>{if(ul){out.push('</ul>');ul=false;}if(ol){out.push('</ol>');ol=false;}};const flushQuote=()=>{if(quote.length){flushP();flushList();out.push('<blockquote>'+quote.map(x=>'<p>'+inlineMarkdown(x)+'</p>').join('')+'</blockquote>');quote=[];}};for(let line of lines){let m;if(/^\u0000CODE\d+\u0000$/.test(line)){flushP();flushList();flushQuote();const idx=Number(line.match(/CODE(\d+)/)[1]);out.push(codes[idx]);continue;}if(!line.trim()){flushP();flushList();flushQuote();continue;}if((m=line.match(/^(#{1,6})\s+(.*)$/))){flushP();flushList();flushQuote();const level=m[1].length;out.push(`<h${level}>${inlineMarkdown(m[2])}</h${level}>`);continue;}if(/^\s*(---+|\*\*\*+|___+)\s*$/.test(line)){flushP();flushList();flushQuote();out.push('<hr>');continue;}if((m=line.match(/^\s*[-*+]\s+\[([ xX])\]\s+(.*)$/))){flushP();flushQuote();if(ol){out.push('</ol>');ol=false;}if(!ul){out.push('<ul>');ul=true;}out.push(`<li class="task"><input type="checkbox" ${m[1].toLowerCase()==='x'?'checked':''}>${inlineMarkdown(m[2])}</li>`);continue;}if((m=line.match(/^\s*[-*+]\s+(.*)$/))){flushP();flushQuote();if(ol){out.push('</ol>');ol=false;}if(!ul){out.push('<ul>');ul=true;}out.push(`<li>${inlineMarkdown(m[1])}</li>`);continue;}if((m=line.match(/^\s*\d+\.\s+(.*)$/))){flushP();flushQuote();if(ul){out.push('</ul>');ul=false;}if(!ol){out.push('<ol>');ol=true;}out.push(`<li>${inlineMarkdown(m[1])}</li>`);continue;}if((m=line.match(/^\s*&gt;\s?(.*)$/))){flushP();flushList();quote.push(m[1]);continue;}flushQuote();flushList();para.push(line);}flushP();flush function apiPath(path){return path.split('/').filter(Boolean).map(encodeURIComponent).join('/');}
async function githubRequest(path,opts={}){const token=state.token||sessionStorage.getItem(SESSION_KEY)||await loadVaultToken();if(!token)throw new Error('请先在设置中连接 GitHub。');const res=await fetch('https://api.github.com'+path,{method:opts.method||'GET',headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+token,'X-GitHub-Api-Version':'2022-11-28',...(opts.body?{'Content-Type':'application/json'}:{})},body:opts.body?JSON.stringify(opts.body):undefined});let payload=null;const tx=await res.text();try{payload=tx?JSON.parse(tx):{};}catch(e){payload={message:tx};}if(!res.ok){const err=new Error(payload.message||`GitHub API 错误 ${res.status}`);err.status=res.status;err.payload=payload;throw err;}return payload;}

function noteFileContent(n){const meta={id:n.id,title:n.title||'',tags:n.tags||[],createdAt:n.createdAt||Date.now(),updatedAt:n.updatedAt||Date.now(),favorite:!!n.favorite,pinned:!!n.pinned,deletedAt:n.deletedAt||null};return `<!-- MORI_NOTE\n${JSON.stringify(meta)}\n-->\n${n.body||''}\n`;}
function parseNoteFile(raw,filename){const m=raw.match(/^<!-- MORI_NOTE\s*\n([\s\S]*?)\n-->\s*\n?/);if(m){try{const meta=JSON.parse(m[1]);return {...meta,id:meta.id||filename.replace(/\.md$/,''),body:raw.slice(m[0].length),tags:Array.isArray(meta.tags)?meta.tags:[],title:meta.title||'',createdAt:meta.createdAt||Date.now(),updatedAt:meta.updatedAt||Date.now(),favorite:!!meta.favorite,pinned:!!meta.pinned,deletedAt:meta.deletedAt||null};}catch(e){}}let title=filename.replace(/\.md$/,'');const h=raw.match(/^#\s+(.+)\n/);if(h){title=h[1].trim();raw=raw.slice(h[0].length);}return {id:filename.replace(/\.md$/,''),title,body:raw,tags:[],createdAt:Date.now(),updatedAt:Date.now(),favorite:false,pinned:false,deletedAt:null};}
async function listRemoteNotes(){const path='/repos/'+state.repo.split('/').map(encodeURIComponent).join('/')+'/contents/'+apiPath(state.dir);let listing;try{listing=await githubRequest(path);}catch(e){if(e.status===404)return [];throw e;}if(!Array.isArray(listing))throw new Error('笔记目录不是文件夹，请检查同步目录设置。');const files=listing.filter(x=>x.type==='file'&&x.name.endsWith('.md'));const notes=[];for(let i=0;i<files.length;i+=5){const batch=files.slice(i,i+5);const got=await Promise.all(batch.map(async f=>{const dat=await githubRequest('/repos/'+state.repo.split('/').map(encodeURIComponent).join('/')+'/contents/'+apiPath(f.path));return {note:parseNoteFile(decodeBase64Utf8(dat.content),f.name),sha:dat.sha,path:f.path};}));notes.push(...got);}return notes;}
async function putRemoteNote(n,sha){const file=(state.dir.replace(/^\/+|\/+$/g,'')+'/'+n.id+'.md').split('/').filter(Boolean).join('/');const body={message:`Mori: ${sha?'update':'add'} note — ${(n.title||'untitled').slice(0,50)}`,content:encodeBase64Utf8(noteFileContent(n))};if(sha)body.sha=sha;return githubRequest('/repos/'+state.repo.split('/').map(encodeURIComponent).join('/')+'/contents/'+apiPath(file),{method:'PUT',body});}
async function syncNow(silent=false){if(state.syncBusy)return;state.repo=$('repo-field')?.value?.trim()||state.repo;state.dir=$('dir-field')?.value?.trim().replace(/^\/+|\/+$/g,'')||state.dir||'mori-notes';if(!state.repo||!state.repo.includes('/')||state.repo.split('/').length!==2){if(!silent)toast('请在设置中填写 owner/repo。');return;}state.syncBusy=true;state.syncError='';updateSyncUI();if(!silent)toast('正在与 GitHub 同步…');try{await saveLocal();const meta=await githubRequest('/repos/'+state.repo.split('/').map(encodeURIComponent).join('/'));if(!meta.private)throw new Error('为了保护笔记隐私，请连接私有仓库。');const remote=await listRemoteNotes(),remoteById=new Map(remote.map(x=>[x.note.id,x])),localById=new Map(state.notes.map(n=>[n.id,n]));let pulled=0,pushed=0;for(const r of remote){const l=localById.get(r.note.id);if(!l||(r.note.updatedAt||0)>=(l.updatedAt||0)){const ix=state.notes.findIndex(n=>n.id===r.note.id);if(ix>=0)state.notes[ix]=r.note;else state.notes.push(r.note);pulled++;}else{try{await putRemoteNote(l,r.sha);pushed++;}catch(e){if(e.status===409||e.status===422){const fresh=await githubRequest('/repos/'+state.repo.split('/').map(encodeURIComponent).join('/')+'/contents/'+apiPath(r.path));const rn=parseNoteFile(decodeBase64Utf8(fresh.content),r.note.id+'.md');if((rn.updatedAt||0)>(l.updatedAt||0)){const ix=state.notes.findIndex(n=>n.id===l.id);if(ix>=0)state.notes[ix]=rn;}else{await putRemoteNote(l,fresh.sha);pushed++;}}else throw e;}}}
const remoteIds=new Set(remote.map(r=>r.note.id));for(const l of [...state.notes]){if(remoteIds.has(l.id))continue;try{await putRemoteNote(l,null);pushed++;}catch(e){if(e.status===409||e.status===422){const x=await listRemoteNotes(),r=x.find(z=>z.note.id===l.id);if(r&&(r.note.updatedAt||0)>=(l.updatedAt||0)){const ix=state.notes.findIndex(n=>n.id===l.id);if(ix>=0)state.notes[ix]=r.note;}else if(r)await putRemoteNote(l,r.sha);else throw e;}else throw e;}}
saveLocal();state.lastSynced=Date.now();state.syncError='';renderAll();if(!silent)toast(`同步完成 · ${pushed} 篇上传，${pulled} 篇合并`);}catch(e){state.syncError=e.message||String(e);if(!silent)toast('同步失败：'+state.syncError);console.error(e);}finally{state.syncBusy=false;renderEditor();updateSyncUI();}}
function scheduleSync(){if(!state.token&&!sessionStorage.getItem(SESSION_KEY)){updateSyncUI();return;}clearTimeout(state.draftTimer);state.draftTimer=setTimeout(()=>syncNow(true),2400);updateSyncUI(true);}
function updateSyncUI(pending=false){const dot=$('list-sync-dot');if(dot){dot.className='sync-dot'+(state.syncError?' error':pending?' pending':'');$('list-sync-label').textContent=state.syncError?'同步失败':state.syncBusy?'同步中…':state.lastSynced?'已同步':'仅保存到本机';}$('sync-btn').classList.toggle('busy',state.syncBusy);$('sync-label').textContent=state.syncBusy?'同步中…':pending?'待同步':'同步';$('local-status').textContent=state.syncBusy?'正在同步…':state.lastSynced&&state.token?'本机已保存 · GitHub 已同步':state.syncError?'已保存在本机（同步失败）':'已保存在本机';}
// A small IndexedDB vault keeps remembered credentials encrypted at rest with a non-exportable Web Crypto key.
let vaultDbPromise;function vaultDb(){if(vaultDbPromise)return vaultDbPromise;vaultDbPromise=new Promise((resolve,reject)=>{const req=indexedDB.open('mori-secure-vault',1);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains('vault'))db.createObjectStore('vault');};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});return vaultDbPromise;}
async function vaultGet(key){const db=await vaultDb();return new Promise((resolve,reject)=>{const tx=db.transaction('vault','readonly'),r=tx.objectStore('vault').get(key);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}
async function vaultSet(key,value){const db=await vaultDb();return new Promise((resolve,reject)=>{const tx=db.transaction('vault','readwrite');tx.objectStore('vault').put(value,key);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);});}
async function vaultDelete(key){const db=await vaultDb();return new Promise((resolve,reject)=>{const tx=db.transaction('vault','readwrite');tx.objectStore('vault').delete(key);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);});}
async function saveVaultToken(token){const key=await crypto.subtle.generateKey({name:'AES-GCM',length:256},false,['encrypt','decrypt']);const iv=crypto.getRandomValues(new Uint8Array(12));const enc=new TextEncoder().encode(token);const cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc);await vaultSet('token-key',key);await vaultSet('token-cipher',{iv:Array.from(iv),data:Array.from(new Uint8Array(cipher))});}
async function loadVaultToken(){try{const stored=await vaultGet('token-cipher'),key=await vaultGet('token-key');if(!stored||!key)return '';const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:new Uint8Array(stored.iv)},key,new Uint8Array(stored.data));return new TextDecoder().decode(plain);}catch(e){return '';}}
async function saveSettings(){const repo=$('repo-field').value.trim(),dir=$('dir-field').value.trim().replace(/^\/+|\/+$/g,'')||'mori-notes',typedToken=$('token-field').value.trim(),mode=document.querySelector('input[name="token-mode"]:checked')?.value||'session';if(!repo||repo.split('/').length!==2){$('settings-status').textContent='仓库格式应为 owner/repo。';return;}state.repo=repo;state.dir=dir;state.tokenMode=mode;try{if(typedToken){state.token=typedToken;if(mode==='session'){sessionStorage.setItem(SESSION_KEY,typedToken);await vaultDelete('token-cipher');await vaultDelete('token-key');}else{sessionStorage.removeItem(SESSION_KEY);await saveVaultToken(typedToken);}}else{state.token=sessionStorage.getItem(SESSION_KEY)||await loadVaultToken();}saveLocal();if(!state.token){$('settings-status').textContent='设置已保存。输入令牌后即可连接 GitHub。';renderAll();return;}$('settings-status').textContent='正在验证仓库和令牌…';await githubRequest('/repos/'+state.repo.split('/').map(encodeURIComponent).join('/'));const m=await githubRequest('/repos/'+state.repo.split('/').map(encodeURIComponent).join('/'));if(!m.private)throw new Error('仓库必须是私有仓库，避免笔记被公开。');$('settings-status').textContent='连接成功。现在可以同步笔记。';renderAll();toast('GitHub 已连接');setTimeout(()=>syncNow(true),450);setTimeout(()=>{if($('modal-root').innerHTML.includes('settings-status'))$('modal-root').innerHTML='';},1200);}catch(e){$('settings-status').textContent='连接失败：'+(e.message||String(e));state.syncError=e.message||String(e);updateSyncUI();}}
async function forgetToken(){if(!confirm('忘记此设备保存的 GitHub 令牌？这不会删除远端笔记。'))return;state.token='';sessionStorage.removeItem(SESSION_KEY);try{await vaultDelete('token-cipher');await vaultDelete('token-key');}catch(e){}$('token-field').value='';$('settings-status').textContent='令牌已从此设备移除。远端笔记未受影响。';updateSyncUI();toast('已忘记令牌');}
function openTagManager(){const root=$('modal-root');const draw=()=>{const tags=tagsList();root.innerHTML=`<div class="modal-backdrop" id="modal-backdrop"><section class="modal small" role="dialog" aria-modal="true" aria-labelledby="modal-title"><header class="modal-header"><div><h2 class="modal-title" id="modal-title">管理标签</h2><div class="modal-description">标签帮助你把想法整理在一起。移除标签不会删除笔记正文。</div></div><button class="icon-btn modal-close" id="close-modal" aria-label="关闭"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></header><div>${tags.length?tags.map(tag=>`<div style="display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line)"><span class="tag-dot" style="--tag-color:var(--accent)"></span><span style="flex:1;min-width:0;overflow-wrap:anywhere">${escapeHtml(tag)}</span><span style="font-size:11px;color:var(--muted);margin-right:8px">${activeNotes().filter(n=>(n.tags||[]).includes(tag)).length} 篇</span><button class="secondary-btn" data-remove-tag="${escapeHtml(tag)}">移除</button></div>`).join(''):'<div class="setting-help" style="padding:12px 0">还没有标签。你可以在笔记编辑区添加标签。</div>'}</div><footer class="modal-footer"><div class="modal-status">${tags.length} 个标签</div><button class="primary-btn" id="close-tag-manager">完成</button></footer></section></div>`;const close=()=>{root.innerHTML='';};$('close-modal').onclick=close;$('close-tag-manager').onclick=close;$('modal-backdrop').addEventListener('click',e=>{if(e.target.id==='modal-backdrop')close();});root.querySelectorAll('[data-remove-tag]').forEach(b=>b.addEventListener('click',()=>{const tag=b.dataset.removeTag;if(!confirm(`从所有笔记中移除“${tag}”标签？笔记内容不会被删除。`))return;state.notes.forEach(n=>{n.tags=(n.tags||[]).filter(t=>t!==tag);});if(state.tagFilter===tag)setView('all');else renderAll();saveLocal();draw();toast('标签已移除');}));};draw();}
function bind(){ $('new-note').onclick=createNote;$('empty-new').onclick=createNote;$('search').addEventListener('input',e=>{state.search=e.target.value;const list=filteredNotes();if(!list.some(n=>n.id===state.currentId))state.currentId=list[0]?.id||null;renderList();renderEditor();});$('search').addEventListener('keydown',e=>{if(e.key==='Escape'){e.target.value='';state.search='';renderAll();e.target.blur();}});document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{setView(b.dataset.view);closeMobileSidebar();}));$('manage-tags').onclick=openTagManager;$('settings-btn').onclick=()=>openModal('settings');$('appearance-btn').onclick=()=>openModal('appearance');$('mobile-nav').onclick=openMobileSidebar;$('mobile-overlay').onclick=closeMobileSidebar;$('sync-btn').onclick=()=>{if(!state.token&&!sessionStorage.getItem(SESSION_KEY))openModal('settings');else syncNow(false);};$('favorite-btn').onclick=toggleFavorite;$('preview-btn').onclick=$('toolbar-preview').onclick=()=>{if(!currentNote())return;state.preview=!state.preview;renderEditor();};$('export-btn').onclick=exportCurrent;$('more-btn').onclick=openMore;$('sort-btn').onclick=()=>{state.sort=state.sort==='updated'?'created':state.sort==='created'?'title':'updated';saveLocal();renderAll();toast(state.sort==='updated'?'按最近编辑排序':state.sort==='created'?'按创建时间排序':'按标题排序');};$('import-btn').onclick=()=>$('import-file').click();$('import-file').onchange=e=>{importMarkdown(e.target.files?.[0]);e.target.value='';};$('note-title').addEventListener('input',e=>{updateNote('title',e.target.value);autoGrow(e.target);});$('note-title').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('note-body').focus();}});$('note-body').addEventListener('input',e=>{updateNote('body',e.target.value);autoGrow(e.target);});$('note-body').addEventListener('keydown',e=>{if(e.key==='Tab'){e.preventDefault();const t=e.target,s=t.selectionStart,en=t.selectionEnd;t.value=t.value.slice(0,s)+'  '+t.value.slice(en);t.setSelectionRange(s+2,s+2);updateNote('body',t.value);}});$('note-tags').addEventListener('change',e=>{const tags=[...new Set(e.target.value.split(/[,，]/).map(x=>x.trim().replace(/^#/,'')).filter(Boolean))];updateNote('tags',tags);renderAll();});document.querySelectorAll('[data-md]').forEach(b=>b.onclick=()=>insertMarkdown(b.dataset.md));$('note-body').addEventListener('paste',e=>{const d=e.clipboardData?.getData('text/plain');if(d&&/<[a-z][\s\S]*>/i.test(d)){e.preventDefault();document.execCommand('insertText',false,d);}});document.addEventListener('keydown',e=>{const mac=navigator.platform.toUpperCase().includes('MAC'),mod=mac?e.metaKey:e.ctrlKey;if(mod&&e.key.toLowerCase()==='k'){e.preventDefault();$('search').focus();$('search').select();}if(mod&&e.key.toLowerCase()==='n'){e.preventDefault();createNote();}if(mod&&e.key.toLowerCase()==='s'){e.preventDefault();if(state.token)syncNow(false);else toast('笔记已保存在本机');}if(e.key==='Escape'&&$('modal-root').innerHTML){$('modal-root').innerHTML='';}});}
async function boot(){loadLocal();state.token=sessionStorage.getItem(SESSION_KEY)||await loadVaultToken();applyAnimal();bind();const first=filteredNotes()[0];state.currentId=first?.id||null;renderAll();if(state.token)updateSyncUI();}
boot();
</script>
